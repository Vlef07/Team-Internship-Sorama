name: sorama

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.10
  - pip

  # PyTorch (CUDA 12.1, works on CPU-only too)
  - pytorch=2.1.*
  - torchaudio=2.1.*
  - pytorch-cuda=12.1

  # Scientific stack
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - tqdm
  - h5py

  # Audio (conda-safe)
  - librosa

  # Pip-only (Windows-safe)
  - pip:
      - soundfile
      - transformers>=4.36
      - datasets
      - accelerate